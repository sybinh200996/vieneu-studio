# Cấu hình Nginx Reverse Proxy cho VieNeu-TTS Studio Web App
# Đặt file này tại: /etc/nginx/sites-available/vieneu-studio
# Kích hoạt bằng lệnh: sudo ln -s /etc/nginx/sites-available/vieneu-studio /etc/nginx/sites-enabled/
# Kiểm tra: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com www.your-domain.com; # Thay thế bằng domain hoặc IP VPS của bạn

    # Giới hạn kích thước upload cho file ghi âm/âm thanh mẫu Voice Cloning (25MB)
    client_max_body_size 25M;

    # Cấu hình buffer
    client_body_buffer_size 128k;

    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;

        # Cấu hình Headers chuẩn
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ WebSockets (nếu sau này mở rộng Streaming real-time)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Tăng timeout tránh ngắt kết nối khi CPU VPS xử lý văn bản dài
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Tắt proxy buffering cho phản hồi streaming âm thanh
        proxy_buffering off;
    }

    # Trang lỗi tuỳ chỉnh
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
